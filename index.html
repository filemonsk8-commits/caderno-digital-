<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2b"><title>Caderno Digital</title><style>
:root{--bg:#0b1220;--panel:#121e31;--panel2:#182840;--line:#263750;--blue:#3b82f6;--text:#edf4ff;--muted:#9aacc5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px}button.primary{background:var(--blue);border-color:var(--blue)}button.danger{color:#ffaaaa}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#101a2b;position:sticky;top:0;z-index:2}.brand{font-weight:750;font-size:19px}.brand span{color:#60a5fa}.layout{display:grid;grid-template-columns:245px 260px 1fr;min-height:calc(100vh - 64px)}aside,.sections{border-right:1px solid var(--line);padding:16px;background:#0e192a}.sections{background:#101c2e}.pane{padding:24px;max-width:1100px;width:100%;margin:auto}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:12px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:9px;cursor:pointer;margin:3px 0}.item:hover,.item.active{background:#1d3555}.item small{color:var(--muted)}.add{width:100%;margin:8px 0 14px}.input{width:100%;background:#0c1727;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;margin:6px 0}.editor{min-height:55vh;outline:none;line-height:1.65;background:#101c2e;border:1px solid var(--line);border-radius:12px;padding:22px;white-space:pre-wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.muted{color:var(--muted)}.empty{display:grid;place-items:center;text-align:center;min-height:60vh;color:var(--muted)}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{font-size:12px;color:#91d5a6}.search{max-width:260px}@media(max-width:800px){.layout{grid-template-columns:1fr}.layout aside,.sections{border-right:0;border-bottom:1px solid var(--line)}.layout aside{display:block}.sections{display:block}.pane{padding:16px}.editor{min-height:42vh}header{padding:0 12px}}
</style></head><body><header><div class="brand">▣ <span>Caderno</span> Digital</div><div class="status" id="status">Salvo neste dispositivo</div></header><div class="layout"><aside><div class="label">Minha biblioteca</div><button class="primary add" id="newBook">＋ Novo caderno</button><input class="input search" id="search" placeholder="Pesquisar páginas..."><div id="books"></div><div class="label">Dados</div><button class="add" id="export">Baixar backup</button><button class="add" id="import">Restaurar backup</button><input id="backupFile" type="file" accept="application/json" hidden></aside><section class="sections"><div class="topline"><div class="label">Seções</div><button id="newSection">＋</button></div><div id="sections"></div><div class="label">Páginas</div><button class="add" id="newPage">＋ Nova página</button><div id="pages"></div></section><main class="pane" id="main"><div class="empty"><div><h2>Seu espaço de ideias</h2><p>Crie um caderno, depois organize em seções e páginas.</p></div></div></main></div>
<script>
const KEY='caderno-digital-v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{books:[],book:null,section:null,page:null};let timer;
const $=id=>document.getElementById(id),id=()=>Math.random().toString(36).slice(2,10),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));$('status').textContent='Salvo neste dispositivo · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});render()};
function book(){return db.books.find(x=>x.id===db.book)}function section(){return book()?.sections.find(x=>x.id===db.section)}function page(){return section()?.pages.find(x=>x.id===db.page)}
function render(){ $('books').innerHTML=db.books.map(b=>'<div class="item '+(b.id===db.book?'active':'')+'" data-book="'+b.id+'">📘 '+esc(b.name)+'</div>').join('')||'<p class="muted">Nenhum caderno criado.</p>'; $('sections').innerHTML=(book()?.sections||[]).map(s=>'<div class="item '+(s.id===db.section?'active':'')+'" data-section="'+s.id+'">▤ '+esc(s.name)+'</div>').join('');$('pages').innerHTML=(section()?.pages||[]).map(p=>'<div class="item '+(p.id===db.page?'active':'')+'" data-page="'+p.id+'">▧ '+esc(p.title||'Sem título')+'</div>').join('');const p=page();$('main').innerHTML=p?'<div class="topline"><div><div class="label">'+esc(book().name)+' / '+esc(section().name)+'</div><input id="title" class="input" style="font-size:24px;font-weight:700" value="'+esc(p.title)+'"></div><button class="danger" id="delPage">Excluir página</button></div><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">☷ Lista</button><button data-cmd="formatBlock" data-value="h2">Título</button></div><div id="editor" class="editor" contenteditable="true">'+(p.body||'')+'</div><p class="muted">As alterações são salvas automaticamente neste dispositivo.</p>':'<div class="empty"><div><h2>Selecione uma página</h2><p>Ou crie uma nova página nesta seção.</p></div></div>';document.querySelectorAll('[data-book]').forEach(e=>e.onclick=()=>{db.book=e.dataset.book;db.section=book().sections[0]?.id||null;db.page=section()?.pages[0]?.id||null;render()});document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>{db.section=e.dataset.section;db.page=section().pages[0]?.id||null;render()});document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{db.page=e.dataset.page;render()});if(p){$('title').oninput=e=>{p.title=e.target.value;save()};$('editor').oninput=e=>{p.body=e.target.innerHTML;clearTimeout(timer);$('status').textContent='Salvando…';timer=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(db));$('status').textContent='Salvo neste dispositivo'},350)};$('delPage').onclick=()=>{if(confirm('Excluir esta página?')){section().pages=section().pages.filter(x=>x.id!==p.id);db.page=section().pages[0]?.id||null;save()}}}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('editor')?.focus()})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('newBook').onclick=()=>{let n=prompt('Nome do caderno:');if(!n)return;let b={id:id(),name:n,sections:[]};db.books.push(b);db.book=b.id;db.section=db.page=null;save()};
$('newSection').onclick=()=>{if(!book())return alert('Crie ou selecione um caderno primeiro.');let n=prompt('Nome da seção:');if(!n)return;let s={id:id(),name:n,pages:[]};book().sections.push(s);db.section=s.id;db.page=null;save()};
$('newPage').onclick=()=>{if(!section())return alert('Crie ou selecione uma seção primeiro.');let p={id:id(),title:'Nova página',body:''};section().pages.push(p);db.page=p.id;save()};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='backup-caderno-digital.json';a.click();URL.revokeObjectURL(u)};
$('import').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.books))throw 0;db=d;save();alert('Backup restaurado.')}catch{alert('Arquivo de backup inválido.')}};
$('search').oninput=e=>{let q=e.target.value.toLowerCase();if(!q){render();return}let hits=[];db.books.forEach(b=>b.sections.forEach(s=>s.pages.forEach(p=>{if((p.title+' '+p.body).toLowerCase().includes(q))hits.push({b,s,p})})));$('books').innerHTML='<div class="label">Resultados: '+hits.length+'</div>'+hits.map(h=>'<div class="item" data-hit="'+h.p.id+'">'+esc(h.p.title)+'<small>'+esc(h.b.name)+'</small></div>').join('');document.querySelectorAll('[data-hit]').forEach(el=>el.onclick=()=>{let h=hits.find(x=>x.p.id===el.dataset.hit);db.book=h.b.id;db.section=h.s.id;db.page=h.p.id;render()})};
if(db.books.length&&!db.book){db.book=db.books[0].id;db.section=book().sections[0]?.id||null;db.page=section()?.pages[0]?.id||null}render();
</script></body></html>
